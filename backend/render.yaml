services:
  - type: web
    name: projectflow-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://projectflow-portal.vercel.app
      - key: DATABASE_URL
        sync: false
    disk:
      name: uploads-storage
      mountPath: /public/uploads
      sizeGB: 1
